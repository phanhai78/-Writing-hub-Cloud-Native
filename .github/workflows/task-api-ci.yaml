name: CI — task-api

on:
  push:
    branches: [main]
    paths:
      - 'services/task-api/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/task-api/**'

env:
  SERVICE: task-api
  GO_VERSION: "1.22"
  REGISTRY: asia-southeast1-docker.pkg.dev
  IMAGE: asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/taskr/task-api

jobs:
  # ─── Job 1: Lint + Test ───
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/task-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/task-api/go.sum

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: services/task-api
          args: --timeout=5m

      - name: Unit tests với race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out | tail -1

  # ─── Job 2: Security scan ───
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: govulncheck — known CVE trong dependencies
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: ${{ env.GO_VERSION }}
          go-package: ./services/task-api/...

  # ─── Job 3: Build & Push (chỉ khi merge vào main) ───
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write        # để commit bump tag
      id-token: write        # cho Workload Identity Federation

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to GCP via Workload Identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Docker meta (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build và Push image
        uses: docker/build-push-action@v6
        with:
          context: services/task-api
          file: services/task-api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1  # Fail CI nếu có CVE CRITICAL/HIGH

      - name: Bump image tag trong config repo (GitOps)
        # Cập nhật kustomization.yaml của overlay gcp-demo với SHA mới
        # ArgoCD sẽ detect thay đổi và tự deploy
        env:
          SHA: ${{ github.sha }}
        run: |
          cd deploy/task-api/overlays/gcp-demo
          # kustomize edit set image cập nhật tag trong kustomization.yaml
          kustomize edit set image \
            task-api=${{ env.IMAGE }}:${SHA:0:7}

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git commit -m "chore: bump task-api to ${SHA:0:7} [skip ci]"
          git push
